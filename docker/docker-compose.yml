# Docker Compose for XQNEXT Framework
version: '3.8'

services:
  xqnext:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: xqnext-framework:0.0.2
    container_name: xqnext-framework
    restart: unless-stopped
    
    ports:
      - "${API_PORT:-8000}:8000"      # WebUI & REST API
      - "${ONEBOT_PORT:-8080}:8080"   # OneBot WebSocket
    
    volumes:
      # 持久化数据（使用绑定挂载）
      - ../data:/app/data
      - ../logs:/app/logs
      - ../plugins:/app/plugins
      
      # 配置文件（只读）
      - ../config.toml:/app/config.toml:ro
    
    environment:
      # 时区
      - TZ=Asia/Shanghai
      
      # Python 配置
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      
      # 应用配置（可通过环境变量覆盖 config.toml）
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # 安全配置
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - WEB_UI_USERNAME=${WEB_UI_USERNAME:-admin}
      - WEB_UI_PASSWORD=${WEB_UI_PASSWORD:-admin123}
      
      # OneBot 配置
      - ONEBOT_WS_URL=${ONEBOT_WS_URL:-ws://localhost:3001}
      - ONEBOT_ACCESS_TOKEN=${ONEBOT_ACCESS_TOKEN:-}
      
      # AI 配置（可选）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    
    networks:
      - xqnext-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 资源限制（可选，防止容器占用过多资源）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

