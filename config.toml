[app]
name = "XQNEXT Framework"
version = "0.0.3"
environment = "development"
debug = false
log_level = "INFO"

[server]
host = "0.0.0.0"
port = 8000

[onebot]
version = "v11"
connection_type = "ws_forward"
http_url = "http://localhost:5700"
ws_url = "ws://127.0.0.1:3001"
ws_reverse_host = "0.0.0.0"
ws_reverse_port = 8080
ws_reverse_path = "/onebot/v11/ws"
access_token = ""
secret = ""
http_timeout = 120.0
ws_api_timeout = 60.0

[database]
url = "sqlite+aiosqlite:///./data/framework.db"

[security]
secret_key = "your-secret-key-change-this-in-production"
access_token_expire_minutes = 30

[logging]
level = "INFO"
file = "logs/onebot_framework.log"

[plugins]
dir = "./plugins"
auto_load = true
thread_pool_enabled = true

[web_ui]
enabled = true
username = "admin"
password = "admin123"

[tencent_cloud]
secret_id = ""
secret_key = ""

[ai]
thread_pool_enabled = true
