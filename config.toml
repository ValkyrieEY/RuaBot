[app]
name = "XQNEXT Framework"
version = "0.1.2"
environment = "development"
log_level = "INFO"

[server]
host = "0.0.0.0"
port = 8000

[onebot]
version = "v11"
connection_type = "ws_forward"
http_url = "http://localhost:5700"
ws_url = "ws://127.0.0.1:3001"
ws_reverse_host = "0.0.0.0"
ws_reverse_port = 8080
ws_reverse_path = "/onebot/v11/ws"
access_token = ""
secret = ""
http_timeout = 120.0
ws_api_timeout = 60.0

[database]
url = "sqlite+aiosqlite:///./data/framework.db"

[security]
secret_key = "your-secret-key-change-this-in-production"
access_token_expire_minutes = 30

[logging]
level = "INFO"
file = "logs/onebot_framework.log"
max_bytes = 10485760
backup_count = 5

[plugins]
dir = "./plugins"
auto_load = true
blocking_task_pool_enabled = true
blocking_task_pool_max_workers = 0
auto_reload = false

[plugins.interceptor]
execution_mode = "hybrid"
circuit_breaker_threshold = 3
circuit_breaker_duration = 30.0
base_timeout = 3.0
max_timeout = 10.0

[web_ui]
enabled = true
username = "admin"
password = "admin123"

[tencent_cloud]
secret_id = ""
secret_key = ""

[ai]
thread_pool_enabled = true

[message_event]
retention_days = 30
max_rows = 0
cleanup_interval_seconds = 86400

[napcat]
install_path = "D:\\zhuomian\\XQNEXT\\napcat\\bootmain"
installer_base = ""
installer_bases = []
test = "value"

[ai_workspace]
mode = "assistant"
